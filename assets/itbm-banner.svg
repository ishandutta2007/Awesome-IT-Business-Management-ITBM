<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300" style="background: #090d16; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.4; }
      50% { transform: scale(1.25) translate(30px, -15px); opacity: 0.7; }
    }
    @keyframes pulseWave {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
      50% { stroke-dashoffset: 120; opacity: 0.7; }
    }
    @keyframes barPulse {
      0%, 100% { height: 35px; y: 215px; }
      50% { height: 75px; y: 175px; }
    }
    @keyframes barPulse2 {
      0%, 100% { height: 65px; y: 185px; }
      50% { height: 30px; y: 220px; }
    }
    @keyframes barPulse3 {
      0%, 100% { height: 50px; y: 200px; }
      50% { height: 85px; y: 165px; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .orb-anim-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-anim-2 { animation: pulseOrb 10s ease-in-out infinite reverse; }
    .wave-line { stroke-dasharray: 12 8; animation: pulseWave 12s linear infinite; }
    .bar-1 { animation: barPulse 4s ease-in-out infinite; }
    .bar-2 { animation: barPulse2 4.5s ease-in-out infinite; }
    .bar-3 { animation: barPulse3 5s ease-in-out infinite; }
    .badge-pill { animation: floatPill 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="12" fill="url(#bg-grad)" />

  <!-- Subtle Matrix / Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1050" y1="0" x2="1050" y2="300" />
  </g>

  <!-- Dynamic Animated Ambient Glows (strictly background z-index) -->
  <circle class="orb-anim-1" cx="200" cy="100" r="160" fill="url(#orb1)" />
  <circle class="orb-anim-2" cx="1020" cy="180" r="180" fill="url(#orb2)" />

  <!-- Animated Background Tech Chart Graphic (Bottom Right Background) -->
  <g opacity="0.22" transform="translate(840, 10)">
    <!-- Simulated ITBM Financial / Metric Bars -->
    <rect class="bar-1" x="50" y="215" width="22" height="35" rx="4" fill="#38bdf8" />
    <rect class="bar-2" x="90" y="185" width="22" height="65" rx="4" fill="#818cf8" />
    <rect class="bar-3" x="130" y="200" width="22" height="50" rx="4" fill="#c084fc" />
    <rect class="bar-1" x="170" y="190" width="22" height="60" rx="4" fill="#38bdf8" />
    <rect class="bar-2" x="210" y="170" width="22" height="80" rx="4" fill="#818cf8" />
    <rect class="bar-3" x="250" y="160" width="22" height="90" rx="4" fill="#c084fc" />
    
    <!-- Connective Trend Line -->
    <path class="wave-line" d="M 60 215 Q 110 160 180 180 T 260 150" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  </g>

  <!-- Foreground Content: Pill Badges -->
  <g class="badge-pill" transform="translate(70, 42)">
    <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18" fill="#93c5fd" font-size="12" font-weight="600" letter-spacing="0.5">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title (Strictly Foreground with drop-shadow & high contrast) -->
  <g transform="translate(70, 118)">
    <text x="0" y="0" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome IT Business Management
    </text>
    <text x="635" y="0" font-size="38" font-weight="800" fill="url(#accent-grad)" letter-spacing="-0.5">
      (ITBM)
    </text>
  </g>

  <!-- Subtitle (Strictly Foreground) -->
  <text x="70" y="160" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Enterprise SaaS Platforms, Open-Source Repositories &amp; Financial Governance Frameworks
  </text>

  <!-- Feature Tags / Category Pillars (Clean badges at bottom) -->
  <g transform="translate(70, 205)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="18" y="21" fill="#e2e8f0" font-size="13" font-weight="600">📊 IT Financial (ITFM)</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(182, 0)">
      <rect width="195" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="18" y="21" fill="#e2e8f0" font-size="13" font-weight="600">🎯 Strategic Portfolio (SPM)</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(389, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="18" y="21" fill="#e2e8f0" font-size="13" font-weight="600">🏢 Technology (TBM)</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(581, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="18" y="21" fill="#e2e8f0" font-size="13" font-weight="600">⚡ FinOps &amp; Cloud</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(758, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
      <text x="18" y="21" fill="#e2e8f0" font-size="13" font-weight="600">🔓 100% Sovereign</text>
    </g>
  </g>
</svg>
